<!doctype html>
<html><head><meta charset="utf-8"><title>Gimis Charms</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  html,body{margin:0;height:46px;background:#14532d;font-family:Segoe UI,sans-serif;overflow:hidden}
  #bar{display:flex;align-items:center;gap:4px;padding:5px 6px;height:36px}
  button{background:transparent;color:#fff;border:0;border-radius:6px;min-width:36px;height:34px;font-size:16px;cursor:pointer}
  button:hover{background:rgba(255,255,255,.18)}
  #ctl{font-size:13px;padding:0 10px;border:1px solid rgba(255,255,255,.5)}
  #url{flex:1;height:32px;border:0;border-radius:6px;padding:0 10px;font-size:14px;outline:none}
  #st{color:#d1fae5;font-size:12px;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style></head>
<body><div id="bar">
  <button id="b" title="Back">&#9664;</button>
  <button id="f" title="Forward">&#9654;</button>
  <button id="r" title="Reload">&#10227;</button>
  <button id="h" title="GIMIS login">&#8962;</button>
  <input id="url" placeholder="Address" spellcheck="false">
  <span id="st"></span>
  <button id="ctl" title="GPSA Control (devices, owner)">GPSA Control</button>
</div>
<script>
  const $ = (i) => document.getElementById(i);
  $('b').onclick = () => gpsa.nav('back');
  $('f').onclick = () => gpsa.nav('forward');
  $('r').onclick = () => gpsa.nav('reload');
  $('h').onclick = () => gpsa.nav('home');
  $('ctl').onclick = () => gpsa.control();
  $('url').addEventListener('keydown', (e) => { if (e.key === 'Enter') gpsa.go($('url').value); });
  gpsa.onUrl((u) => { if (document.activeElement !== $('url')) $('url').value = u; });
  gpsa.onStatus((s) => { $('st').textContent = s; $('st').title = s; });
</script></body></html>
