org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
# Pin GeckoView after the first good build, e.g. geckoviewVersion=143.0.20251001000000
# (versions: https://maven.mozilla.org/?prefix=maven2/org/mozilla/geckoview/). Without it the newest release is used.
# geckoviewVersion=
# GeckoView 158+ and AndroidX 1.19 need compileSdk 37; AGP 9.1 officially stops at 36 but compiles fine against 37.
android.suppressUnsupportedCompileSdk=37
