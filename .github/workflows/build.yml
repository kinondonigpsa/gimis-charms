name: Build & Release Gimis Charms (auto-update)
# Kila ukibadilisha chochote na kukisukuma kwenye "main" (au Actions > Run workflow):
#   1) inajenga APK (simu + tablet) na installer za Windows,
#   2) inatoa GitHub Release mpya (tag build-<namba>),
#   3) inaandika taarifa ya toleo jipya kwenye Supabase (gpsa_release) -> vifaa vyote vinaona na kujisasisha.
# Faili za .md hazianzishi build. Maelezo kamili: AUTO-UPDATE.md
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.github/workflows/windows.yml'
  workflow_dispatch: {}

permissions:
  contents: write

# Push mpya ikiingia wakati build ya zamani bado inaendelea, ya zamani inasimamishwa.
concurrency:
  group: gimis-release
  cancel-in-progress: true

env:
  # Mahali release zinapowekwa. Default = repo hii. Kama repo hii ni PRIVATE, weka repo nyingine ya umma
  # (Settings > Secrets and variables > Actions > Variables: RELEASE_REPO = kinondonigpsa/gimis-releases)
  # na Secret RELEASES_TOKEN (PAT yenye ruhusa ya "contents: write" kwenye repo hiyo).
  RELEASE_REPO: ${{ vars.RELEASE_REPO || github.repository }}
  GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}

jobs:
  # ------------------------------------------------------------------ TOLEO + RELEASE (draft)
  prepare:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.v.outputs.build }}
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Toleo na namba ya build
        id: v
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('extensions/gpsa-extension/manifest.json',encoding='utf-8-sig'))['version'])")
          BUILD=$((GITHUB_RUN_NUMBER + 100))      # inapanda kila build; +100 ili iwe juu ya versionCode ya zamani (4)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "tag=build-$BUILD" >> "$GITHUB_OUTPUT"
          echo "Toleo $VERSION, build $BUILD"
      - name: Tengeneza release (draft)
        env:
          TAG: ${{ steps.v.outputs.tag }}
          VERSION: ${{ steps.v.outputs.version }}
          BUILD: ${{ steps.v.outputs.build }}
        run: |
          if gh release view "$TAG" --repo "$RELEASE_REPO" > /dev/null 2>&1; then
            echo "Release $TAG ipo tayari (re-run)."
          else
            TARGET=""
            if [ "$RELEASE_REPO" = "$GITHUB_REPOSITORY" ]; then TARGET="--target $GITHUB_SHA"; fi
            gh release create "$TAG" --repo "$RELEASE_REPO" --draft $TARGET \
              --title "Gimis Charms v$VERSION (build $BUILD)" \
              --notes "Build ya otomatiki kutoka commit $GITHUB_SHA"
          fi

  # ------------------------------------------------------------------ ANDROID (simu + tablet)
  android:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      GRADLE_PROPS: -PappVersionCode=${{ needs.prepare.outputs.build }} -PappVersionName=${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Accept Android licenses (SDK is already installed on the runner)
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: current }
      - name: Prepare extensions (Chrome -> Firefox format)
        run: python3 tools/prepare_extensions.py

      - name: APK za universal (64-bit + 32-bit) - simu na tablet
        run: |
          mkdir -p out/phones out/tablets
          gradle --no-daemon :app:assemblePhoneRelease :app:assembleTabletRelease $GRADLE_PROPS
          cp app/build/outputs/apk/phone/release/app-phone-release.apk   out/phones/Gimis-Charms-Simu-universal.apk
          cp app/build/outputs/apk/tablet/release/app-tablet-release.apk out/tablets/Gimis-Charms-Tablet-universal.apk

      - name: APK ndogo za 64-bit (arm64)
        run: |
          gradle --no-daemon :app:assemblePhoneRelease :app:assembleTabletRelease -Pabis=arm64-v8a $GRADLE_PROPS
          cp app/build/outputs/apk/phone/release/app-phone-release.apk   out/phones/Gimis-Charms-Simu-arm64-only.apk
          cp app/build/outputs/apk/tablet/release/app-tablet-release.apk out/tablets/Gimis-Charms-Tablet-arm64-only.apk

      - name: APK ndogo za 32-bit (arm)
        run: |
          gradle --no-daemon :app:assemblePhoneRelease :app:assembleTabletRelease -Pabis=armeabi-v7a $GRADLE_PROPS
          cp app/build/outputs/apk/phone/release/app-phone-release.apk   out/phones/Gimis-Charms-Simu-arm32-only.apk
          cp app/build/outputs/apk/tablet/release/app-tablet-release.apk out/tablets/Gimis-Charms-Tablet-arm32-only.apk

      - name: Maelekezo ya kuinstall
        run: |
          for kind in phones tablets; do
            if [ "$kind" = "phones" ]; then who="SIMU (Android phones)"; pre="Simu"; else who="TABLET (Android tablets)"; pre="Tablet"; fi
            {
              echo "Gimis Charms - $who"
              echo
              echo "Jaribu faili kwa mpangilio huu:"
              echo "1. Gimis-Charms-$pre-universal.apk   -> inafaa kila kifaa (64-bit na 32-bit). Anza na hii."
              echo "2. Gimis-Charms-$pre-arm64-only.apk  -> ndogo zaidi, kwa vifaa vya 64-bit (vingi vya kuanzia 2017)."
              echo "3. Gimis-Charms-$pre-arm32-only.apk  -> ndogo zaidi, kwa vifaa vya zamani vya 32-bit."
              echo
              echo "Hatua: tuma APK kwenye kifaa > ifungue > ruhusu 'Install unknown apps' > Install > Open."
              echo "Gimis Charms inajiwekea icon kwenye home screen yenyewe (ikiuliza 'Add to home screen' bonyeza Add)."
              echo "Baada ya kuinstall mara moja, matoleo yajayo yanajisasisha yenyewe (app itakuuliza 'Sasisha sasa')."
            } > "out/$kind/SOMA-HAPA-$pre.txt"
          done

      # Faili zinaenda moja kwa moja kwenye release (hakuna "artifacts", kwa hiyo quota ya GitHub haijazi).
      - name: Weka APK kwenye release
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" out/phones/* out/tablets/* --repo "$RELEASE_REPO" --clobber

  # ------------------------------------------------------------------ WINDOWS (.exe)
  windows:
    needs: prepare
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Weka toleo na namba ya build ndani ya app
        shell: bash
        env:
          VER: ${{ needs.prepare.outputs.version }}
          BUILD: ${{ needs.prepare.outputs.build }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=process.env.VER;fs.writeFileSync('package.json',JSON.stringify(p,null,2));fs.writeFileSync('build-info.json',JSON.stringify({version:process.env.VER,build:Number(process.env.BUILD),tag:process.env.TAG}));"
          cat build-info.json
      - name: Install dependencies
        run: npm install
      # Kila aina inajengwa kivyake; ikishindwa moja, nyingine bado zinatoka.
      - name: Installer ya 64-bit (x64) - kompyuta nyingi
        continue-on-error: true
        run: npx electron-builder --win --x64 --publish never
      - name: Installer ya 32-bit (ia32)
        continue-on-error: true
        run: npx electron-builder --win --ia32 --publish never
      - name: Installer ya ARM64 (Windows on ARM)
        continue-on-error: true
        run: npx electron-builder --win --arm64 --publish never
      - name: Orodha ya installer zilizotoka
        shell: bash
        run: |
          ls -la dist || true
          cat > dist/SOMA-HAPA-Windows.txt <<'TXT'
          Gimis Charms - Windows (Windows 10 na 11)

          Gimis-Charms-Setup-<toleo>-x64.exe    -> kompyuta nyingi (64-bit). Anza na hii.
          Gimis-Charms-Setup-<toleo>-ia32.exe   -> kompyuta za 32-bit.
          Gimis-Charms-Setup-<toleo>-arm64.exe  -> Windows on ARM.

          Hatua: bonyeza .exe mara mbili. Inajiweka yenyewe, inatengeneza icon kwenye Desktop na Start Menu, kisha inafungua app.
          Baada ya kuinstall mara moja, matoleo yajayo yanajisasisha yenyewe (app itakuuliza 'Sasisha sasa').
          Windows ikionya (SmartScreen): More info > Run anyway.
          TXT
          count=$(ls dist/*.exe 2>/dev/null | wc -l)
          echo "Installer zilizotoka: $count"
          [ "$count" -ge 1 ]
      - name: Weka installer kwenye release
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" dist/*.exe dist/SOMA-HAPA-Windows.txt --repo "$RELEASE_REPO" --clobber

  # ------------------------------------------------------------------ TANGAZA TOLEO (Supabase)
  publish:
    needs: [prepare, android, windows]
    # Android ikifaulu tunatangaza, hata kama Windows imeshindwa kabisa.
    if: ${{ !cancelled() && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 20 }
      - name: Toa release (si draft tena)
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$TAG" --repo "$RELEASE_REPO" --draft=false --latest
      - name: Andika toleo jipya kwenye Supabase
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          BUILD: ${{ needs.prepare.outputs.build }}
          VERSION: ${{ needs.prepare.outputs.version }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
        run: python3 tools/publish_update.py
      - name: Futa release za zamani (zinabaki 5 za mwisho)
        continue-on-error: true
        run: |
          gh release list --repo "$RELEASE_REPO" --limit 200 --json tagName,createdAt \
            -q '[.[] | select(.tagName | startswith("build-"))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' \
            | while read -r t; do [ -n "$t" ] && gh release delete "$t" --repo "$RELEASE_REPO" --cleanup-tag -y; done
